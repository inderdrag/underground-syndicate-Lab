name: Build and Release Standalone Game Installers

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web & Standalone HTML
        run: npm run build

      - name: Build Windows .exe Installer & Portable Binary (Electron)
        run: npx electron-builder --win nsis portable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: Underground Syndicate Standalone Game Release
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist-electron/*.exe
            Underground-Syndicate-Launcher.html
            Play-Game-Offline.html
