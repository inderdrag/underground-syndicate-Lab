name: Build Windows EXE Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Release Windows .exe
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 🔨 Build Frontend Bundle & Single-File Game
        run: npm run build

      - name: 🚀 Package Windows .EXE (Installer & Portable)
        run: npx electron-builder --win nsis portable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Determine Release Tag
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: 📤 Publish Standalone .EXE to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Underground Syndicate Game Build (${{ steps.vars.outputs.tag }})"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist-electron/*.exe
            Underground-Syndicate-Game.html
            Play-Game-Offline.html
            Underground-Syndicate-Launcher.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
