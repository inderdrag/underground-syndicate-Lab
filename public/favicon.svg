<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#102a1d"/>
      <stop offset="100%" stop-color="#070a0e"/>
    </radialGradient>
    <linearGradient id="flaskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#10b981" stroke-width="8" stroke-opacity="0.4"/>

  <!-- Outer Neon Circuit Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="16 12" opacity="0.3"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#059669" stroke-width="2" opacity="0.4"/>

  <!-- Flask Body -->
  <g filter="url(#glow)">
    <!-- Flask Outline & Liquid -->
    <path d="M216 110 H296 V170 L370 330 C385 365 360 400 320 400 H192 C152 400 127 365 142 330 L216 170 Z" fill="#062016" stroke="url(#neonGlow)" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Liquid Fill inside Flask -->
    <path d="M162 330 L200 240 Q256 260 312 240 L350 330 Q360 355 330 375 Q310 385 256 385 Q202 385 182 375 Q152 355 162 330 Z" fill="url(#flaskGrad)"/>

    <!-- Glowing Liquid Surface wave -->
    <path d="M200 240 Q256 265 312 240" fill="none" stroke="#a7f3d0" stroke-width="6" stroke-linecap="round"/>

    <!-- Bubbles -->
    <circle cx="230" cy="310" r="12" fill="#a7f3d0" opacity="0.8"/>
    <circle cx="280" cy="280" r="8" fill="#a7f3d0" opacity="0.9"/>
    <circle cx="250" cy="210" r="10" fill="#a7f3d0" opacity="0.7"/>
    <circle cx="220" cy="160" r="6" fill="#a7f3d0" opacity="0.6"/>

    <!-- Flask Neck Lip -->
    <rect x="200" y="96" width="112" height="18" rx="9" fill="url(#neonGlow)"/>

    <!-- Biohazard / Leaf Specimen Icon in Flask -->
    <path d="M256 300 L244 330 H268 Z M240 340 L256 315 L272 340 H240 Z" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
